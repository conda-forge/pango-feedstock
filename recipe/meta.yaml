{% set version = "1.58.2" %}
{% set version_majmin = ".".join(version.split(".", 2)[:2]) %}

package:
  name: pango-split
  version: {{ version }}

source:
  url: https://download.gnome.org/sources/pango/{{ version_majmin }}/pango-{{ version }}.tar.xz
  sha256: 342385b6ca3b7c73455d7c80a13b7dbe4489e00bc3bd4c5bd6ed4dce421e374a

build:
  number: 2
  detect_binary_files_with_prefix: true

requirements:
  build:
    - meson
    - ninja
    - pkg-config
    - {{ compiler('c') }}
    - {{ stdlib("c") }}
    - {{ compiler('cxx') }}
    - gobject-introspection
    - cairo           # [build_platform != target_platform]
    - expat           # [build_platform != target_platform]
    - fribidi         # [build_platform != target_platform]
    - glib            # [build_platform != target_platform]
    - harfbuzz        # [build_platform != target_platform]
    - fontconfig      # [build_platform != target_platform]
    - freetype        # [build_platform != target_platform]
    - libpng          # [build_platform != target_platform]
    # needed for pkg-config/development files:
    - harfbuzz        # [build_platform != target_platform]
    - xorg-xorgproto  # [build_platform != target_platform]
    - zlib            # [build_platform != target_platform]
  host:
    - cairo
    - expat  # need to name this explicitly to get the development files
    - fribidi
    - glib
    - harfbuzz
    - fontconfig
    - freetype
    - harfbuzz
    - libpng
    - xorg-xorgproto
    - zlib

outputs:
  - name: libpango
    files:
      - lib/libpango*.so*                               # [linux]
      - lib/libpango*.dylib                             # [osx]
      - Library/bin/pango*.dll                          # [win]
      - lib/girepository-1.0/Pango*.typelib             # [unix]
      - Library/lib/girepository-1.0/Pango*.typelib     # [win]
    build:
      ignore_run_exports_from:
        - {{ compiler('cxx') }}
    requirements:
      build:
        - {{ compiler('c') }}
        - {{ stdlib("c") }}
        - {{ compiler('cxx') }}
      host:
        - cairo
        - expat
        - fribidi
        - glib
        - harfbuzz
        - fontconfig
        - freetype
        - libpng
        - zlib
    test:
      files:
        - run_test.py
      requires:
        - pygobject
      commands:
        {% set libs = ["Pango", "PangoCairo", "PangoFT2"] %}
        {% for lib in libs %}
        - test -f $PREFIX/lib/lib{{ lib | lower }}-1.0${SHLIB_EXT}  # [unix]
        - if not exist %PREFIX%\\Library\\bin\\{{ lib | lower }}-1.0-0.dll exit 1  # [win]
        - test -f $PREFIX/lib/girepository-1.0/{{ lib }}-1.0.typelib    # [unix]
        - if not exist %PREFIX%\Library\lib\girepository-1.0\{{ lib }}-1.0.typelib exit 1         # [win]
        {% endfor %}
        - python run_test.py

  - name: libpango-devel
    files:
      - bin/pango-*                                     # [unix]
      - include/pango-1.0                               # [unix]
      - lib/pkgconfig/pango*.pc                         # [unix]
      - share/gir-1.0/Pango*.gir                        # [unix]
      - Library/bin/pango-*.exe                         # [win]
      - Library/include/pango-1.0                       # [win]
      - Library/lib/pango*-1.0.lib                      # [win]
      - Library/lib/pkgconfig/pango*.pc                 # [win]
      - Library/share/gir-1.0/Pango*.gir                # [win]
    build:
      ignore_run_exports_from:
        - {{ compiler('cxx') }}
      run_exports:
        - {{ pin_subpackage('libpango', max_pin='x') }}
    requirements:
      build:
        - {{ compiler('c') }}
        - {{ stdlib("c") }}
        - {{ compiler('cxx') }}
      host:
        - {{ pin_subpackage('libpango', exact=True) }}
        - cairo
        - glib
        - harfbuzz
        - fontconfig
        - freetype
      run:
        - {{ pin_subpackage('libpango', exact=True) }}
        # pango's public headers and .pc files reach these, but the runtime
        # packages libpango pulls in (libharfbuzz, libfreetype) lack them
        - freetype
        - libharfbuzz-devel
    test:
      requires:
        - expat  # fontconfig.pc's Requires.private, which fontconfig does not provide
        - pkg-config
      commands:
        - pango-view --help
        - pkg-config --print-errors --exact-version "{{ version }}" pango pangocairo pangoft2 pangofc pangoot
        {% for lib in libs %}
        - test -f `pkg-config --variable=libdir --dont-define-prefix {{ lib | lower }}`/lib{{ lib | lower }}-1.0${SHLIB_EXT}  # [unix]
        - for /f "usebackq tokens=*" %%a in (`pkg-config --variable=exec_prefix --dont-define-prefix {{ lib | lower }}`) do if not exist "%%a/bin/{{ lib | lower }}-1.0-0.dll" exit 1  # [win]
        - if not exist %PREFIX%\\Library\\lib\\{{ lib | lower }}-1.0.lib exit 1  # [win]
        - for /f "usebackq tokens=*" %%a in (`pkg-config --variable=libdir --dont-define-prefix {{ lib | lower }}`) do if not exist "%%a/{{ lib | lower }}-1.0.lib" exit 1  # [win]
        {% endfor %}

  # compatibility wrapper, so existing `pango` host deps keep getting the
  # development files
  - name: pango
    build:
      run_exports:
        - {{ pin_subpackage('libpango', max_pin='x') }}
    requirements:
      host:
        - {{ pin_subpackage('libpango-devel', exact=True) }}
      run:
        - {{ pin_subpackage('libpango-devel', exact=True) }}
    test:
      commands:
        - echo "pure metapackage"

about:
  home: http://www.pango.org/
  license: LGPL-2.1-or-later
  license_file: COPYING
  summary: Text layout and rendering engine.
  description: |
    Pango is a library for laying out and rendering of text, with an emphasis
    on internationalization. Pango can be used anywhere that text layout is
    needed, though most of the work on Pango so far has been done in the
    context of the GTK+ widget toolkit. Pango forms the core of text and font
    handling for GTK+-2.x.
  doc_url: http://www.pango.org/
  dev_url: https://gitlab.gnome.org/GNOME/pango

extra:
  recipe-maintainers:
    - ocefpaf
    - ccordoba12
    - jakirkham
    - pkgw
  feedstock-name: pango
